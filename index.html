<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Job Card Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Job Card">
  <meta name="theme-color" content="#1D2125">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700&display=swap');

    :root {
      --bg: #0F1117;
      --surface: #161B22;
      --surface-alt: #21262D;
      --ink: #E6EDF3;
      --muted: #8B949E;
      --line: #30363D;
      --plate: #FFD700;
      --plate-ink: #000;
      --accent: #58A6FF;
      --accent-ink: #0F1117;
      --danger: #F85149;
      --ok: #3FB950;
      --warning: #D29922;
      --shadow: rgba(0, 0, 0, 0.3);
      --sans: 'Barlow', system-ui, -apple-system, sans-serif;
      --cond: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FFFFFF;
        --surface: #F6F8FA;
        --surface-alt: #EAEEF2;
        --ink: #24292F;
        --muted: #57606A;
        --line: #D0D7DE;
        --plate: #F7D117;
        --plate-ink: #111;
        --accent: #0969DA;
        --accent-ink: #fff;
        --ok: #1A7F37;
        --warning: #9E6A03;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px var(--shadow);
      z-index: 10;
    }

    h1 {
      font-family: var(--cond);
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      padding: 10px 16px;
      font-family: var(--sans);
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 40px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .btn.icon-only {
      padding: 8px;
      min-height: 36px;
      width: 36px;
      font-size: 1.2rem;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface-alt);
      color: var(--ink);
    }

    .btn.danger {
      background: var(--danger);
      color: white;
    }

    main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .summary {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
      min-width: 70px;
    }

    .search-box,
    .filter {
      background: var(--surface-alt);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: var(--sans);
      color: var(--ink);
      font-size: 0.9rem;
      min-height: 36px;
    }

    .search-box {
      flex: 1;
      min-width: 150px;
    }

    .utility-buttons {
      display: flex;
      gap: 8px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px var(--shadow);
      transition: all 0.2s ease;
      cursor: grab;
    }

    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 12px var(--shadow);
      transform: translateY(-2px);
    }

    .card.dragging {
      opacity: 0.5;
      border-style: dashed;
    }

    .card-id {
      background: var(--plate);
      color: var(--plate-ink);
      font-family: var(--cond);
      font-weight: 700;
      padding: 8px 12px;
      font-size: 1.2rem;
      display: inline-block;
      width: max-content;
      border-bottom-right-radius: 6px;
      letter-spacing: 0.05em;
      min-width: 100px;
      text-align: center;
    }

    .card-body {
      padding: 12px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
      line-height: 1.3;
      color: var(--ink);
    }

    .card-desc {
      color: var(--muted);
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.4;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      flex-wrap: wrap;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 8px;
      background: var(--surface-alt);
      border-radius: 4px;
    }

    .status::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .status.ok { color: var(--ok); }
    .status.ok::before { background: var(--ok); }

    .status.pending { color: var(--warning); }
    .status.pending::before { background: var(--warning); }

    .status.in-progress { color: var(--accent); }
    .status.in-progress::before { background: var(--accent); }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--muted);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      color: var(--ink);
      border-color: var(--accent);
      background: var(--surface-alt);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--surface-alt);
    }

    .modal-title {
      font-family: var(--cond);
      font-size: 1.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--muted);
      transition: color 0.15s ease;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover { color: var(--ink); }

    .modal-body { padding: 20px; }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--line);
      margin: -20px -20px 20px -20px;
      padding: 0 20px;
    }

    .tab {
      background: transparent;
      border: none;
      padding: 12px 16px;
      font-family: var(--sans);
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: all 0.15s ease;
      font-size: 0.95rem;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab:hover { color: var(--ink); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: var(--ink);
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface-alt);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-family: var(--sans);
      font-size: 1rem;
      transition: border-color 0.15s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
    }

    .form-group textarea { resize: vertical; min-height: 90px; }

    .camera-view {
      width: 100%;
      height: 300px;
      background: var(--surface-alt);
      border-radius: 8px;
      border: 1px solid var(--line);
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }

    #cameraStream {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .camera-btn { flex: 1; min-width: 120px; }

    .captured-plate {
      background: var(--plate);
      color: var(--plate-ink);
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1.2rem;
      text-align: center;
      font-family: 'Courier New', monospace;
      margin-bottom: 12px;
      letter-spacing: 2px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .recording-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid var(--danger);
      border-radius: 6px;
      color: var(--danger);
      font-weight: 600;
      font-size: 0.85rem;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .recording-indicator::before {
      content: '●';
      font-size: 1.2rem;
    }

    .photo-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .photo-tile {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--surface-alt);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      display: none;
    }

    .empty-state.show {
      display: block;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--muted);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 640px) {
      h1 { font-size: 1.2rem; }
      .btn { padding: 8px 12px; font-size: 0.85rem; }
      .modal-content { max-width: 100%; border-radius: 12px 12px 0 0; }
      .grid { grid-template-columns: 1fr; gap: 10px; padding: 10px; }
      .camera-view { height: 250px; }
      .tabs { margin: -16px -16px 16px -16px; padding: 0 16px; }
      .modal-body { padding: 16px; }
      .modal-header { padding: 16px; }
      .utility-buttons { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🚗 Job Cards</h1>
      <div class="header-actions">
        <button class="btn icon-only" title="Settings" onclick="showSettings()">⚙️</button>
        <button class="btn" onclick="openModal()">➕ New</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="summary" id="jobSummary">0 jobs</div>
      <input id="searchInput" class="search-box" type="search" placeholder="Search..." oninput="renderJobs()">
      <select class="filter" id="statusFilter" onchange="renderJobs()">
        <option value="all">All</option>
        <option value="pending">Pending</option>
        <option value="in-progress">In Progress</option>
        <option value="ok">Done</option>
      </select>
      <div class="utility-buttons">
        <button class="btn secondary" onclick="exportJobsJSON()">Export JSON</button>
        <button class="btn secondary" onclick="window.print()">Print PDF</button>
      </div>
    </div>

    <main>
      <div class="grid" id="jobGrid"></div>
      <div class="empty-state" id="emptyState">
        <div class="empty-state-icon">📋</div>
        <p>No job cards yet. Start by creating a new one!</p>
      </div>
    </main>
  </div>

  <div class="modal" id="jobModal" onclick="if(event.target === this) closeModal()">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">New Job</h2>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>

      <div class="modal-body">
        <div class="tabs">
          <button class="tab active" onclick="switchTab(event, 'capture-tab')">📷 Capture</button>
          <button class="tab" onclick="switchTab(event, 'manual-tab')">✏️ Manual</button>
        </div>

        <div id="capture-tab" class="tab-content active">
          <div class="form-group">
            <label>Camera Access</label>
            <div class="camera-view">
              <video id="cameraStream" playsinline></video>
            </div>
          </div>

          <div class="camera-controls">
            <button class="btn camera-btn" id="startCameraBtn" onclick="startCamera()">📷 Start Camera</button>
            <button class="btn secondary camera-btn" id="snapBtn" onclick="captureFrame()" style="display:none;">📸 Snap</button>
            <button class="btn secondary camera-btn" id="stopCameraBtn" onclick="stopCamera()" style="display:none;">Stop</button>
          </div>

          <div id="plateResult" style="display:none;">
            <label>Detected Plate Number</label>
            <div class="captured-plate" id="capturedPlate">—</div>
          </div>

          <div class="form-group">
            <label>Captured Images</label>
            <div class="photo-gallery" id="photoGallery"></div>
          </div>

          <div class="form-group">
            <label>Record Job Details (Tap to Start)</label>
            <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
              <button class="btn camera-btn" id="recordBtn" onclick="toggleRecording()">🎤 Record</button>
              <button class="btn secondary camera-btn" id="playbackBtn" onclick="playRecording()" style="display:none;">▶️ Playback</button>
              <button class="btn secondary camera-btn" id="clearAudioBtn" onclick="clearRecording()" style="display:none;">🗑️ Clear</button>
            </div>
            <div id="recordingStatus" style="display:none;"></div>
            <audio id="audioPlayback" style="width: 100%; margin-top: 12px;"></audio>
          </div>

          <div class="form-group">
            <label>Job Title</label>
            <input type="text" id="titleCapture" placeholder="Vehicle or issue title">
          </div>

          <div class="form-group">
            <label>Status</label>
            <select id="statusCapture">
              <option value="pending">Pending</option>
              <option value="in-progress">In Progress</option>
              <option value="ok">Completed</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="button" class="btn secondary" onclick="closeModal()">Cancel</button>
            <button type="button" class="btn" onclick="saveFromCapture()">Save Job</button>
          </div>
        </div>

        <div id="manual-tab" class="tab-content">
          <form id="jobForm" onsubmit="saveJob(event)">
            <input type="hidden" id="jobId">

            <div class="form-group">
              <label for="title">Job Title</label>
              <input type="text" id="title" required placeholder="e.g. Broken Light Fixture">
            </div>

            <div class="form-group">
              <label for="desc">Description</label>
              <textarea id="desc" required placeholder="Describe the work..."></textarea>
            </div>

            <div class="form-group">
              <label>Voice to Text</label>
              <button type="button" class="btn secondary" id="dictateBtn" onclick="toggleDictation()">🎙 Dictate</button>
            </div>

            <div class="form-group">
              <label for="plateNum">Plate Number (Optional)</label>
              <input type="text" id="plateNum" placeholder="e.g. ABC 1234">
            </div>

            <div class="form-group">
              <label for="dueDate">Due Date</label>
              <input type="date" id="dueDate">
            </div>

            <div class="form-group">
              <label for="status">Status</label>
              <select id="status">
                <option value="pending">Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="ok">Completed</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="button" class="btn secondary" onclick="closeModal()">Cancel</button>
              <button type="submit" class="btn">Save Card</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'job-card-manager-v3';
    const defaultJobs = [
      {
        id: 1001,
        title: 'HVAC System Maintenance',
        description: 'Routine checkup of server room cooling units and replacing filters.',
        plateNum: 'ABC 1234',
        status: 'ok',
        dueDate: '2026-10-20'
      }
    ];

    let jobs = loadJobs();
    let jobCounter = Math.max(...jobs.map(job => Number(job.id) || 0), 1001) + 1;
    let mediaStream = null;
    let micStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let capturedPhotos = [];
    let isDictating = false;
    let recognition = null;

    function loadJobs() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return [...defaultJobs];
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) && parsed.length ? parsed : [...defaultJobs];
      } catch (error) {
        return [...defaultJobs];
      }
    }

    function persistJobs() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(jobs));
    }

    function switchTab(event, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    function exportJobsJSON() {
      const blob = new Blob([JSON.stringify(jobs, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'job-cards.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function showSettings() {
      alert('Settings: future updates for team sync and job templates');
    }

    function clearPhotoGallery() {
      capturedPhotos = [];
      document.getElementById('photoGallery').innerHTML = '';
    }

    async function startCamera() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        document.getElementById('cameraStream').srcObject = mediaStream;
        document.getElementById('startCameraBtn').style.display = 'none';
        document.getElementById('snapBtn').style.display = 'block';
        document.getElementById('stopCameraBtn').style.display = 'block';
      } catch (err) {
        alert('Camera access denied: ' + err.message);
      }
    }

    function stopCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      document.getElementById('cameraStream').srcObject = null;
      document.getElementById('startCameraBtn').style.display = 'block';
      document.getElementById('snapBtn').style.display = 'none';
      document.getElementById('stopCameraBtn').style.display = 'none';
    }

    function captureFrame() {
      const video = document.getElementById('cameraStream');
      if (!video || !video.videoWidth) {
        alert('Start the camera before taking a photo.');
        return;
      }

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      const dataUrl = canvas.toDataURL('image/png');
      capturedPhotos.push(dataUrl);
      renderPhotoGallery();

      const plateNumber = generateMockPlate();
      document.getElementById('capturedPlate').textContent = plateNumber;
      document.getElementById('plateResult').style.display = 'block';
      document.getElementById('titleCapture').value = `Vehicle ${plateNumber}`;
    }

    function renderPhotoGallery() {
      const gallery = document.getElementById('photoGallery');
      gallery.innerHTML = '';
      capturedPhotos.forEach((src) => {
        const tile = document.createElement('div');
        tile.className = 'photo-tile';
        const img = document.createElement('img');
        img.src = src;
        tile.appendChild(img);
        gallery.appendChild(tile);
      });
    }

    function generateMockPlate() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const nums = '0123456789';
      let plate = '';
      for (let i = 0; i < 3; i++) plate += chars[Math.floor(Math.random() * chars.length)];
      plate += ' ';
      for (let i = 0; i < 4; i++) plate += nums[Math.floor(Math.random() * nums.length)];
      return plate;
    }

    async function toggleRecording() {
      if (!isRecording) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(micStream);
          recordedChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) recordedChunks.push(event.data);
          };

          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'audio/webm' });
            const url = URL.createObjectURL(blob);
            document.getElementById('audioPlayback').src = url;
            document.getElementById('playbackBtn').style.display = 'block';
            document.getElementById('clearAudioBtn').style.display = 'block';
            document.getElementById('recordingStatus').textContent = '✓ Recording saved';
            document.getElementById('recordingStatus').style.display = 'block';
            document.getElementById('recordingStatus').style.color = 'var(--ok)';
            document.getElementById('recordingStatus').innerHTML = '<div class="recording-indicator">Recording saved</div>';
            if (micStream) {
              micStream.getTracks().forEach(track => track.stop());
              micStream = null;
            }
          };

          mediaRecorder.start();
          isRecording = true;
          document.getElementById('recordBtn').textContent = '🛑 Stop Recording';
          document.getElementById('recordBtn').classList.add('danger');
          document.getElementById('recordingStatus').innerHTML = '<div class="recording-indicator">Recording</div>';
          document.getElementById('recordingStatus').style.display = 'block';
          document.getElementById('recordingStatus').style.color = 'var(--danger)';
        } catch (err) {
          alert('Microphone access denied: ' + err.message);
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        if (micStream) {
          micStream.getTracks().forEach(track => track.stop());
          micStream = null;
        }
        isRecording = false;
        document.getElementById('recordBtn').textContent = '🎤 Record';
        document.getElementById('recordBtn').classList.remove('danger');
      }
    }

    function playRecording() {
      const audio = document.getElementById('audioPlayback');
      if (audio.src) audio.play();
    }

    function clearRecording() {
      recordedChunks = [];
      document.getElementById('audioPlayback').src = '';
      document.getElementById('playbackBtn').style.display = 'none';
      document.getElementById('clearAudioBtn').style.display = 'none';
      document.getElementById('recordingStatus').style.display = 'none';
    }

    function toggleDictation() {
      const descField = document.getElementById('desc');
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('Speech recognition is not supported in this browser.');
        return;
      }

      if (isDictating) {
        recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'en-GB';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isDictating = true;
        document.getElementById('dictateBtn').textContent = '🛑 Stop Dictation';
        document.getElementById('dictateBtn').classList.add('danger');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        const current = descField.value.trim();
        descField.value = current ? current + ' ' + transcript : transcript;
      };

      recognition.onend = () => {
        isDictating = false;
        document.getElementById('dictateBtn').textContent = '🎙 Dictate';
        document.getElementById('dictateBtn').classList.remove('danger');
      };

      recognition.start();
    }

    function saveFromCapture() {
      const title = document.getElementById('titleCapture').value.trim();
      const status = document.getElementById('statusCapture').value;
      const plate = document.getElementById('capturedPlate').textContent;

      if (!title) {
        alert('Please enter a job title before saving.');
        return;
      }

      const newJob = {
        id: Number(jobCounter++),
        title,
        description: `Capture from camera. Plate: ${plate !== '—' ? plate : 'N/A'}. Photos: ${capturedPhotos.length}.`,
        plateNum: plate !== '—' ? plate : '',
        status,
        dueDate: ''
      };

      jobs.unshift(newJob);
      persistJobs();
      renderJobs();
      closeModal();
      resetCaptureTab();
    }

    function resetCaptureTab() {
      document.getElementById('titleCapture').value = '';
      document.getElementById('statusCapture').value = 'pending';
      document.getElementById('plateResult').style.display = 'none';
      document.getElementById('capturedPlate').textContent = '—';
      document.getElementById('recordingStatus').style.display = 'none';
      clearRecording();
      stopCamera();
      clearPhotoGallery();
    }

    function formatDueDate(dateValue) {
      if (!dateValue) return '';
      const d = new Date(dateValue + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function isOverdue(job) {
      if (!job.dueDate || job.status === 'ok') return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = new Date(job.dueDate + 'T00:00:00');
      return due < today;
    }

    function getFilteredJobs() {
      const filter = document.getElementById('statusFilter').value;
      const searchText = document.getElementById('searchInput').value.trim().toLowerCase();

      return jobs.filter(job => {
        const matchesStatus = filter === 'all' || job.status === filter;
        const haystack = `${job.title} ${job.description} ${job.plateNum || ''}`.toLowerCase();
        const matchesSearch = !searchText || haystack.includes(searchText);
        return matchesStatus && matchesSearch;
      });
    }

    function renderJobs() {
      const grid = document.getElementById('jobGrid');
      const emptyState = document.getElementById('emptyState');
      const summary = document.getElementById('jobSummary');
      const filteredJobs = getFilteredJobs();

      grid.innerHTML = '';

      filteredJobs.forEach(job => {
        const card = document.createElement('div');
        card.className = 'card';
        card.draggable = true;
        card.dataset.id = String(job.id);

        card.addEventListener('dragstart', (event) => {
          card.classList.add('dragging');
          event.dataTransfer.setData('text/plain', String(job.id));
        });

        card.addEventListener('dragend', () => card.classList.remove('dragging'));
        card.addEventListener('dragover', (event) => event.preventDefault());

        card.addEventListener('drop', (event) => {
          event.preventDefault();
          const fromId = Number(event.dataTransfer.getData('text/plain'));
          const toId = Number(job.id);
          if (fromId && toId && fromId !== toId) reorderJobs(fromId, toId);
        });

        const cardId = document.createElement('div');
        cardId.className = 'card-id';
        cardId.textContent = job.plateNum || `#${job.id}`;

        const cardBody = document.createElement('div');
        cardBody.className = 'card-body';

        const title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = job.title;

        const desc = document.createElement('div');
        desc.className = 'card-desc';
        desc.textContent = job.description;

        const dueText = document.createElement('div');
        dueText.className = 'card-desc';
        const dueValue = formatDueDate(job.dueDate);
        dueText.textContent = dueValue ? `Due: ${dueValue}` : 'No due date';

        const metaRow = document.createElement('div');
        metaRow.className = 'meta-row';

        const statusBadge = document.createElement('div');
        statusBadge.className = `status ${job.status}`;
        statusBadge.textContent = job.status === 'ok' ? '✓ Done' : job.status === 'in-progress' ? '▶ Active' : '⏱ Pending';

        const actionGroup = document.createElement('div');
        actionGroup.className = 'card-actions';

        const editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.className = 'icon-btn';
        editButton.title = 'Edit';
        editButton.textContent = '✎';
        editButton.onclick = () => openModal(job.id);

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'icon-btn';
        deleteButton.title = 'Delete';
        deleteButton.textContent = '🗑';
        deleteButton.onclick = () => deleteJob(job.id);

        actionGroup.append(editButton, deleteButton);
        metaRow.append(statusBadge, actionGroup);
        cardBody.append(title, desc, dueText, metaRow);
        card.append(cardId, cardBody);
        grid.appendChild(card);
      });

      const total = jobs.length;
      const filteredCount = filteredJobs.length;
      summary.textContent = `${filteredCount}/${total}`;
      emptyState.classList.toggle('show', filteredCount === 0);
    }

    function reorderJobs(fromId, toId) {
      const fromIndex = jobs.findIndex(job => job.id === fromId);
      const toIndex = jobs.findIndex(job => job.id === toId);
      if (fromIndex === -1 || toIndex === -1) return;

      const [moved] = jobs.splice(fromIndex, 1);
      jobs.splice(toIndex, 0, moved);
      persistJobs();
      renderJobs();
    }

    function openModal(jobId = null) {
      const modal = document.getElementById('jobModal');
      const form = document.getElementById('jobForm');
      const modalTitle = document.getElementById('modalTitle');
      const hiddenId = document.getElementById('jobId');
      const titleInput = document.getElementById('title');
      const descInput = document.getElementById('desc');
      const plateInput = document.getElementById('plateNum');
      const dueInput = document.getElementById('dueDate');
      const statusInput = document.getElementById('status');

      if (jobId) {
        const job = jobs.find(item => item.id === jobId);
        if (!job) return;
        hiddenId.value = job.id;
        titleInput.value = job.title;
        descInput.value = job.description;
        plateInput.value = job.plateNum || '';
        dueInput.value = job.dueDate || '';
        statusInput.value = job.status || 'pending';
        modalTitle.textContent = 'Edit Job';
        document.querySelector('.tab[onclick*="manual"]').click();
      } else {
        form.reset();
        hiddenId.value = '';
        statusInput.value = 'pending';
        modalTitle.textContent = 'New Job';
        resetCaptureTab();
        document.querySelector('.tab[onclick*="capture"]').click();
      }

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('jobModal').classList.remove('active');
      document.getElementById('jobForm').reset();
      document.getElementById('jobId').value = '';
      stopCamera();
      if (isRecording) toggleRecording();
      if (isDictating && recognition) recognition.stop();
      resetCaptureTab();
    }

    function saveJob(event) {
      event.preventDefault();

      const idField = document.getElementById('jobId').value;
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('desc').value.trim();
      const plateNum = document.getElementById('plateNum').value.trim();
      const dueDate = document.getElementById('dueDate').value;
      const status = document.getElementById('status').value;

      if (!title || !description) return;

      if (idField) {
        const idx = jobs.findIndex(job => job.id === Number(idField));
        if (idx !== -1) {
          jobs[idx] = {
            ...jobs[idx],
            title,
            description,
            plateNum,
            dueDate,
            status
          };
        }
      } else {
        const newJob = {
          id: Number(jobCounter++),
          title,
          description,
          plateNum,
          dueDate,
          status
        };
        jobs.unshift(newJob);
      }

      persistJobs();
      renderJobs();
      closeModal();
    }

    function deleteJob(jobId) {
      if (confirm('Delete this job card?')) {
        jobs = jobs.filter(job => job.id !== jobId);
        persistJobs();
        renderJobs();
      }
    }

    renderJobs();
  </script>
</body>
</html>
