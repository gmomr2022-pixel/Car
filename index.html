<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Job Card Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Job Card">
  <style>
    @font-face {
      font-family: 'Barlow';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('https://gstatic.com') format('truetype');
    }

    @font-face {
      font-family: 'Barlow';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('https://gstatic.com') format('truetype');
    }

    @font-face {
      font-family: 'Barlow Condensed';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('https://gstatic.com') format('truetype');
    }

    :root {
      --bg: #E4E6E8;
      --surface: #FFFFFF;
      --ink: #1D2125;
      --muted: #5E666E;
      --line: #CBD0D5;
      --plate: #F7D117;
      --plate-ink: #111;
      --accent: #1D2125;
      --accent-ink: #fff;
      --danger: #B3261E;
      --ok: #1E7B46;
      --warning: #C76D00;
      --shadow: rgba(0, 0, 0, 0.08);
      --sans: 'Barlow', system-ui, -apple-system, sans-serif;
      --cond: 'Barlow Condensed', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181B;
        --surface: #22262A;
        --ink: #EEF0F2;
        --muted: #9AA3A6;
        --line: #434B54;
        --accent: #EEF0F2;
        --accent-ink: #16181B;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto 24px auto;
      border-bottom: 2px solid var(--line);
      padding-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      font-family: var(--cond);
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn {
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      padding: 10px 16px;
      font-family: var(--sans);
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.15s ease;
      min-height: 42px;
    }

    .btn:hover { opacity: 0.9; }

    .btn.secondary {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn.danger {
      background: var(--danger);
      color: white;
    }

    .toolbar {
      max-width: 1200px;
      margin: 0 auto 18px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .summary {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
    }

    .filter {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: var(--sans);
      color: var(--ink);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 12px var(--shadow);
    }

    .card-id {
      background: var(--plate);
      color: var(--plate-ink);
      font-family: var(--cond);
      font-weight: 700;
      padding: 6px 12px;
      font-size: 1.1rem;
      display: inline-block;
      width: max-content;
      border-bottom-right-radius: 6px;
      letter-spacing: 0.04em;
    }

    .card-body {
      padding: 16px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.22rem;
      line-height: 1.25;
    }

    .card-desc {
      color: var(--muted);
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status.ok { color: var(--ok); }
    .status.ok::before { background: var(--ok); }

    .status.pending { color: var(--warning); }
    .status.pending::before { background: var(--warning); }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 6px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 1rem;
      color: var(--ink);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-content {
      background: var(--surface);
      padding: 24px;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      border: 1px solid var(--line);
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .modal-title {
      font-family: var(--cond);
      font-size: 1.8rem;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-family: var(--sans);
      font-size: 1rem;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 90px;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .empty-state {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 32px 16px;
      color: var(--muted);
      display: none;
    }

    @media (max-width: 480px) {
      .btn {
        width: 100%;
      }

      .header-actions,
      .toolbar,
      .meta-row,
      .form-actions {
        width: 100%;
      }

      .card-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🔧 Job Card Manager</h1>
    <div class="header-actions">
      <button class="btn secondary" onclick="clearAllJobs()">Clear All</button>
      <button class="btn" onclick="openModal()">➕ New Job</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="summary" id="jobSummary">0 jobs</div>
    <select class="filter" id="statusFilter" onchange="renderJobs()">
      <option value="all">All statuses</option>
      <option value="pending">Pending</option>
      <option value="ok">Completed</option>
    </select>
  </div>

  <main class="grid" id="jobGrid"></main>

  <div class="empty-state" id="emptyState">
    No jobs match your current filter.
  </div>

  <div class="modal" id="jobModal" onclick="if(event.target === this) closeModal()">
    <div class="modal-content">
      <h2 class="modal-title" id="modalTitle">Create New Job</h2>
      <form id="jobForm" onsubmit="saveJob(event)">
        <input type="hidden" id="jobId">

        <div class="form-group">
          <label for="title">Job Title</label>
          <input type="text" id="title" required placeholder="e.g. Broken Light Fixture">
        </div>

        <div class="form-group">
          <label for="desc">Description</label>
          <textarea id="desc" rows="3" required placeholder="Describe the work requirements..."></textarea>
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status">
            <option value="pending">Pending</option>
            <option value="ok">Completed</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="button" class="btn secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Save Card</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'job-card-manager-v1';
    const defaultJobs = [
      {
        id: 1001,
        title: 'HVAC System Maintenance',
        description: 'Routine checkup of server room cooling units and replacing filters.',
        status: 'ok'
      }
    ];

    let jobs = loadJobs();
    let jobCounter = Math.max(...jobs.map(job => Number(job.id) || 0), 1001) + 1;

    function loadJobs() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return [...defaultJobs];
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) && parsed.length ? parsed : [...defaultJobs];
      } catch (error) {
        return [...defaultJobs];
      }
    }

    function persistJobs() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(jobs));
    }

    function getFilteredJobs() {
      const filter = document.getElementById('statusFilter').value;
      if (filter === 'all') return jobs;
      return jobs.filter(job => job.status === filter);
    }

    function renderJobs() {
      const grid = document.getElementById('jobGrid');
      const emptyState = document.getElementById('emptyState');
      const summary = document.getElementById('jobSummary');
      const filteredJobs = getFilteredJobs();

      grid.innerHTML = '';

      filteredJobs.forEach(job => {
        const card = document.createElement('div');
        card.className = 'card';

        const cardId = document.createElement('div');
        cardId.className = 'card-id';
        cardId.textContent = `#JOB-${job.id}`;

        const cardBody = document.createElement('div');
        cardBody.className = 'card-body';

        const title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = job.title;

        const desc = document.createElement('div');
        desc.className = 'card-desc';
        desc.textContent = job.description;

        const metaRow = document.createElement('div');
        metaRow.className = 'meta-row';

        const status = document.createElement('div');
        status.className = `status ${job.status}`;
        status.textContent = job.status === 'ok' ? 'Completed' : 'Pending';

        const actionGroup = document.createElement('div');
        actionGroup.className = 'card-actions';

        const editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.className = 'icon-btn';
        editButton.title = 'Edit job';
        editButton.textContent = '✎';
        editButton.onclick = () => openModal(job.id);

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'icon-btn';
        deleteButton.title = 'Delete job';
        deleteButton.textContent = '🗑';
        deleteButton.onclick = () => deleteJob(job.id);

        actionGroup.append(editButton, deleteButton);
        metaRow.append(status, actionGroup);
        cardBody.append(title, desc, metaRow);
        card.append(cardId, cardBody);
        grid.appendChild(card);
      });

      const total = jobs.length;
      const filteredCount = filteredJobs.length;
      summary.textContent = `${filteredCount} of ${total} job${total === 1 ? '' : 's'}`;
      emptyState.style.display = filteredCount === 0 ? 'block' : 'none';
    }

    function openModal(jobId = null) {
      const modal = document.getElementById('jobModal');
      const form = document.getElementById('jobForm');
      const modalTitle = document.getElementById('modalTitle');
      const hiddenId = document.getElementById('jobId');
      const titleInput = document.getElementById('title');
      const descInput = document.getElementById('desc');
      const statusInput = document.getElementById('status');

      if (jobId) {
        const job = jobs.find(item => item.id === jobId);
        if (!job) return;
        hiddenId.value = job.id;
        titleInput.value = job.title;
        descInput.value = job.description;
        statusInput.value = job.status;
        modalTitle.textContent = 'Edit Job';
      } else {
        form.reset();
        hiddenId.value = '';
        statusInput.value = 'pending';
        modalTitle.textContent = 'Create New Job';
      }

      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('jobModal').style.display = 'none';
      document.getElementById('jobForm').reset();
      document.getElementById('jobId').value = '';
    }

    function saveJob(event) {
      event.preventDefault();

      const idField = document.getElementById('jobId').value;
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('desc').value.trim();
      const status = document.getElementById('status').value;

      if (!title || !description) return;

      if (idField) {
        const idx = jobs.findIndex(job => job.id === Number(idField));
        if (idx !== -1) {
          jobs[idx] = {
            ...jobs[idx],
            title,
            description,
            status
          };
        }
      } else {
        const newJob = {
          id: Number(jobCounter++),
          title,
          description,
          status
        };
        jobs.unshift(newJob);
      }

      persistJobs();
      renderJobs();
      closeModal();
    }

    function deleteJob(jobId) {
      const confirmed = window.confirm('Delete this job card?');
      if (!confirmed) return;

      jobs = jobs.filter(job => job.id !== jobId);
      persistJobs();
      renderJobs();
    }

    function clearAllJobs() {
      const confirmed = window.confirm('Delete all job cards?');
      if (!confirmed) return;

      jobs = [];
      persistJobs();
      renderJobs();
    }

    renderJobs();
  </script>
</body>
</html>
