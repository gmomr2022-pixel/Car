<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Job Card Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Card">
<style>
  @font-face {
    font-family: 'Barlow';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('https://gstatic.com') format('truetype');
  }
  @font-face {
    font-family: 'Barlow';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('https://gstatic.com') format('truetype');
  }
  @font-face {
    font-family: 'Barlow Condensed';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('https://gstatic.com') format('truetype');
  }

  :root {
    --bg: #E4E6E8; --surface: #FFFFFF; --ink: #1D2125; --muted: #5E666E; --line: #CBD0D5;
    --plate: #F7D117; --plate-ink: #111; --accent: #1D2125; --accent-ink: #fff; --danger: #B3261E; --ok: #1E7B46;
    --sans: 'Barlow', system-ui, -apple-system, sans-serif;
    --cond: 'Barlow Condensed', system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181B; --surface: #22262A; --ink: #EEF0F2; --muted: #9AA3A6; --line: #434B54;
      --accent: #EEF0F2; --accent-ink: #16181B;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    line-height: 1.5;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto 24px auto;
    border-bottom: 2px solid var(--line);
    padding-bottom: 12px;
  }

  h1 {
    font-family: var(--cond);
    font-size: 2rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 8px 16px;
    font-family: var(--sans);
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
  }

  .btn:hover { opacity: 0.9; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .card-id {
    background: var(--plate);
    color: var(--plate-ink);
    font-family: var(--cond);
    font-weight: 700;
    padding: 4px 12px;
    font-size: 1.1rem;
    display: inline-block;
    width: max-content;
    border-bottom-right-radius: 4px;
  }

  .card-body {
    padding: 16px;
    flex-grow: 1;
  }

  .card-title {
    font-weight: 600;
    font-size: 1.25rem;
    margin-bottom: 8px;
  }

  .card-desc {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 16px;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
  }

  .status::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .status.ok { color: var(--ok); }
  .status.ok::before { background: var(--ok); }
  .status.pending { color: var(--plate-ink); }
  .status.pending::before { background: var(--plate); }

  /* Modal styling */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center; align-items: center;
    z-index: 1000;
  }

  .modal-content {
    background: var(--surface);
    padding: 24px;
    border-radius: 6px;
    width: 100%;
    max-width: 450px;
    border: 1px solid var(--line);
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .form-group input, .form-group textarea, .form-group select {
    width: 100%;
    padding: 8px;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family: var(--sans);
  }
</style>
</head>
<body>

<header>
  <h1>🔧 Job Card Manager</h1>
  <button class="btn" onclick="toggleModal(true)">➕ New Job</button>
</header>

<main class="grid" id="jobGrid">
  <!-- Seed Card -->
  <div class="card">
    <div class="card-id">#JOB-1001</div>
    <div class="card-body">
      <div class="card-title">HVAC System Maintenance</div>
      <div class="card-desc">Routine checkup of server room cooling units and replacing filters.</div>
      <div class="status ok">Completed</div>
    </div>
  </div>
</main>

<!-- Create Job Modal -->
<div class="modal" id="jobModal" onclick="if(event.target===this) toggleModal(false)">
  <div class="modal-content">
    <h2 style="font-family: var(--cond); margin-bottom: 16px;">CREATE NEW JOB</h2>
    <form id="jobForm" onsubmit="addJob(event)">
      <div class="form-group">
        <label>Job Title</label>
        <input type="text" id="title" required placeholder="e.g. Broken Light Fixture">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="desc" rows="3" required placeholder="Describe the work requirements..."></textarea>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="status">
          <option value="pending">Pending</option>
          <option value="ok">Completed</option>
        </select>
      </div>
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button type="button" class="btn" style="background: var(--muted);" onclick="toggleModal(false)">Cancel</button>
        <button type="submit" class="btn">Save Card</button>
      </div>
    </form>
  </div>
</div>

<script>
  let jobCounter = 1002;

  function toggleModal(show) {
    document.getElementById('jobModal').style.display = show ? 'flex' : 'none';
  }

  function addJob(e) {
    e.preventDefault();
    const title = document.getElementById('title').value;
    const desc = document.getElementById('desc').value;
    const status = document.getElementById('status').value;

    const grid = document.getElementById('jobGrid');
    const newCard = document.createElement('div');
    newCard.className = 'card';
    newCard.innerHTML = `
      <div class="card-id">#JOB-${jobCounter++}</div>
      <div class="card-body">
        <div class="card-title">${title}</div>
        <div class="card-desc">${desc}</div>
        <div class="status ${status}">${status === 'ok' ? 'Completed' : 'Pending'}</div>
      </div>
    `;

    grid.insertBefore(newCard, grid.firstChild);
    document.getElementById('jobForm').reset();
    toggleModal(false);
  }
</script>
</body>
</html>
